name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-voice-assistant:ci .

      - name: Start container and check health
        run: |
          docker run -d --name ci-test -p 8000:8000 -e GEMINI_API_KEY=dummy-key devops-voice-assistant:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done
          curl -f http://localhost:8000/health
          docker logs ci-test
          docker rm -f ci-test
